 <!-- HERO with Carousel -->
<section id="home" class="relative overflow-hidden">
  <!-- put overlay behind and ignore touches -->
  <div class="absolute inset-0 z-0 bg-gradient-to-b from-sky-50 to-transparent pointer-events-none"></div>

  <!-- bring real content above -->
  <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-16 md:pt-24">
    <div class="grid lg:grid-cols-2 gap-10 items-center">
      <!-- Left text -->
      <div class="fade-in relative z-10">
        ...
      </div>

      <!-- Right: Carousel -->
      <div class="relative z-10 fade-in">
        <div class="relative overflow-hidden rounded-3xl border border-slate-200 shadow-inner">
          <div id="heroSlides" class="whitespace-nowrap transition-transform duration-500 ease-out">
            <!-- Slides injected by JS -->
          </div>

          <!-- Arrows (ensure they can receive taps) -->
          <button id="prevBtn" aria-label="Previous"
            class="absolute left-3 top-1/2 -translate-y-1/2 rounded-full bg-white/80 hover:bg-white shadow p-2 pointer-events-auto">
            &#10094;
          </button>
          <button id="nextBtn" aria-label="Next"
            class="absolute right-3 top-1/2 -translate-y-1/2 rounded-full bg-white/80 hover:bg-white shadow p-2 pointer-events-auto">
            &#10095;
          </button>

          <!-- Dots -->
          <div id="heroDots" class="absolute bottom-3 inset-x-0 flex items-center justify-center gap-2 pointer-events-auto"></div>
        </div>
        <p class="mt-2 text-xs text-slate-500 text-center">Swipe on mobile • Hover to pause</p>
      </div>
    </div>
  </div>
</section>


  <footer class="border-t border-slate-200 bg-white">

 <script>
  // --- HERO CAROUSEL ---
  const images = [
    // You can replace these with your own URLs or /assets/* images
    "https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=80&w=1200&auto=format&fit=crop",
    "https://images.unsplash.com/photo-1559028012-481c04fa702d?q=80&w=1200&auto=format&fit=crop",
    "https://images.unsplash.com/photo-1487058792275-0ad4aaf24ca7?q=80&w=1200&auto=format&fit=crop",
    "https://images.unsplash.com/photo-1552581234-26160f608093?q=80&w=1200&auto=format&fit=crop",
    "https://images.unsplash.com/photo-1504691342899-9d7eea6fc381?q=80&w=1200&auto=format&fit=crop"
  ];

  const slidesEl = document.getElementById('heroSlides');
  const dotsEl = document.getElementById('heroDots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  // Build slides
  function renderSlides() {
    slidesEl.innerHTML = images.map(src => `
      <div class="inline-block align-top w-full">
        <img src="${src}" alt="Portfolio slide" class="block w-full h-[320px] sm:h-[380px] md:h-[420px] object-cover select-none" loading="lazy"/>
      </div>
    `).join('');
  }

  // Build dots
  function renderDots() {
    dotsEl.innerHTML = images.map((_, i) => `
      <button class="h-2.5 w-2.5 rounded-full border border-white/70 bg-white/50 hover:bg-white ${i===0?'ring-2 ring-sky-300':''}" data-idx="${i}" aria-label="Go to slide ${i+1}"></button>
    `).join('');
  }

  let idx = 0;
  let timer = null;
  const interval = 3500;
  const setTransform = () => {
    slidesEl.style.transform = `translateX(-${idx * 100}%)`;
    Array.from(dotsEl.children).forEach((d, i) => {
      d.classList.toggle('ring-2', i === idx);
      d.classList.toggle('ring-sky-300', i === idx);
    });
  };

  function next() { idx = (idx + 1) % images.length; setTransform(); }
  function prev() { idx = (idx - 1 + images.length) % images.length; setTransform(); }

  function startAuto() { stopAuto(); timer = setInterval(next, interval); }
  function stopAuto() { if (timer) clearInterval(timer); }

  // Init
  renderSlides();
  renderDots();
  setTransform();
  startAuto();

  // Buttons
  nextBtn.addEventListener('click', () => { next(); startAuto(); });
  prevBtn.addEventListener('click', () => { prev(); startAuto(); });

  // Dots click
  dotsEl.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-idx]');
    if (!b) return;
    idx = parseInt(b.dataset.idx, 10);
    setTransform();
    startAuto();
  });

  // Pause on hover (desktop)
  slidesEl.parentElement.addEventListener('mouseenter', stopAuto);
  slidesEl.parentElement.addEventListener('mouseleave', startAuto);

  // Touch swipe (mobile)
  let startX = null;
  slidesEl.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
  slidesEl.addEventListener('touchmove', (e) => {
    if (startX === null) return;
    const dx = e.touches[0].clientX - startX;
    if (Math.abs(dx) > 50) {
      dx < 0 ? next() : prev();
      startX = null;
      startAuto();
    }
  }, { passive: true });
</script>

</body>
