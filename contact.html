<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Contact | Venu M</title>
<meta name="description" content="Contact Venu M — Frontend Web Developer for freelance projects and collaborations.">
<link rel="icon" href="./assets/favicon.png">
<style>
  /* === Scoped CSS === */
  .page-contact{--fg:#0f172a;--muted:#475569;--bg:#fff;--soft:#f8fafc;--line:#e2e8f0;--brand:#2563eb}
  .page-contact,*{box-sizing:border-box}
  .page-contact{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;color:var(--fg);background:var(--bg);line-height:1.6}
  .page-contact a{text-decoration:none;color:inherit}
  .page-contact .container{max-width:800px;margin-inline:auto;padding:0 16px}
  header{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:10}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
  .logo{font-weight:800}.logo span{color:var(--brand)}
  .menu{display:flex;gap:14px;list-style:none;margin:0;padding:0}
  .menu a{padding:8px 10px;border-radius:10px}
  .menu a.active,.menu a:hover{background:var(--soft)}

  main{padding:40px 0 60px}
  h1{font-size:clamp(1.6rem,2.5vw,2.2rem);margin:0 0 12px}
  p.lead{color:var(--muted);margin:0 0 24px;text-align:center}

  form{display:grid;gap:16px;background:#fff;padding:24px;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 6px #0001}
  label{display:flex;flex-direction:column;gap:6px;font-weight:500}
  input,textarea{padding:12px;border-radius:10px;border:1px solid var(--line);font-size:1rem}
  textarea{resize:vertical}
  button{padding:12px 18px;border-radius:10px;border:1px solid #111827;background:#111827;color:#fff;cursor:pointer;font-size:1rem}
  button:hover{background:#2563eb;border-color:#2563eb}
  .status{margin-top:10px;font-size:.95rem;color:var(--muted)}
  footer{border-top:1px solid var(--line);padding:20px 0;text-align:center;color:#64748b;font-size:.95rem;margin-top:32px}
</style>
</head>
<body class="page-contact">
  <!-- Header -->
  <header>
    <div class="container nav">
      <a href="./index.html" class="logo">Venu<span> M</span></a>
      <ul class="menu">
        <li><a href="./index.html">Home</a></li>
        <li><a href="./projects.html">Projects</a></li>
        <li><a href="./skills.html">Skills</a></li>
        <li><a href="./services.html">Services</a></li>
        <li><a href="./contact.html" class="active">Contact</a></li>
      </ul>
    </div>
  </header>

  <!-- Main -->
  <main class="container">
    <h1>Contact Me</h1>
    <p class="lead">Let’s talk about your project. Fill out the form below and I’ll reply within 24 hours.</p>

    <form action="https://formspree.io/f/your-form-id" method="POST" id="contact-form">
      <label>
        Your Name
        <input type="text" name="name" required>
      </label>
      <label>
        Email Address
        <input type="email" name="email" required>
      </label>
      <label>
        Project Details
        <textarea name="message" rows="6" required></textarea>
      </label>
      <button type="submit">Send Message</button>
      <p class="status" id="form-status"></p>
    </form>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">© 2025 Venu M • <a href="./contact.html">Hire me</a></div>
  </footer>

  <!-- Small JS for success/fail message -->
  <script>
    const form = document.getElementById("contact-form");
    const status = document.getElementById("form-status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = new FormData(form);
      try {
        const res = await fetch(form.action, {
          method: form.method,
          body: data,
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
          status.textContent = "✅ Thanks! I’ll get back to you soon.";
          form.reset();
        } else {
          status.textContent = "❌ Oops! Something went wrong. Please try again.";
        }
      } catch (err) {
        status.textContent = "❌ Error sending. Check connection.";
      }
    });
  </script>
</body>
</html>
